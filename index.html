<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f4fd1'/><g stroke='%23fff' stroke-width='1.8' fill='none' stroke-linecap='round'><path d='M16 26V15C16 9 8 8 8 13.5C8 17 12.5 17 12.5 14'/><path d='M16 15C16 9 24 8 24 13.5C24 17 19.5 17 19.5 14'/></g></svg>">
<title>KazOlymp — архив олимпиадных задач</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0e0f12; --night2:#16181d; --night3:#22252c;
  --paper:#f4f1ea; --paper2:#ebe6db; --card:#fbfaf6;
  --ink:#121212; --ink2:#3b3b3b; --muted:#85817a; --line:#dcd6c9;
  --gold:#c9a45c; --gold2:#e2c88f;
  --ok:#2d7a4b; --ok-l:#e6f0e8; --bad:#a3352b; --bad-l:#f6e6e3;
  --serif:"Playfair Display",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Onest,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.serif{font-family:var(--serif)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(14,15,18,.94);backdrop-filter:blur(10px);border-bottom:1px solid #26292f;color:#f4f1ea}
.nav{display:flex;align-items:center;height:70px;gap:24px}
.logo{display:flex;align-items:baseline;gap:2px;font-family:var(--serif);font-size:24px;letter-spacing:.01em}
.logo i{font-style:italic;color:var(--gold2)}
.logo sup{font-family:Onest;font-size:10px;letter-spacing:.14em;color:var(--muted);margin-left:8px;align-self:center}
.links{display:flex;gap:34px;margin-left:auto;font-size:14px;letter-spacing:.04em}
.links a{color:#b9b4aa;padding:4px 0;border-bottom:1px solid transparent;transition:.2s}
.links a:hover,.links a.on{color:#fff;border-bottom-color:var(--gold)}
.burger{display:none;margin-left:auto;background:none;border:1px solid #3a3d44;color:#fff;border-radius:4px;padding:6px 10px;cursor:pointer}

/* ---------- dark hero bands ---------- */
.dark{background:var(--night);color:#f4f1ea;position:relative;overflow:hidden}
.dark::before{content:"";position:absolute;inset:0;background:
  radial-gradient(700px 380px at 85% -10%,rgba(201,164,92,.16),transparent 60%),
  radial-gradient(500px 300px at 0% 110%,rgba(201,164,92,.07),transparent 60%);pointer-events:none}
.dark .wrap{position:relative}
.hero{padding:110px 0 96px}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0 0 26px;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:500;font-size:68px;line-height:1.04;letter-spacing:-.01em;margin:0;max-width:820px}
.hero h1 em{color:var(--gold2)}
.hero p{color:#a9a49a;font-size:19px;font-weight:300;max-width:560px;margin:28px 0 0}
.search-big{margin-top:44px;display:flex;max-width:620px;border:1px solid #3a3d44;border-radius:3px;background:rgba(255,255,255,.03)}
.search-big input{flex:1;background:none;border:none;padding:18px 20px;color:#fff;font:inherit;font-size:16px;outline:none}
.search-big input::placeholder{color:#7d7a74}
.search-big button{background:var(--gold);border:none;color:#111;padding:0 26px;font-weight:500;cursor:pointer;font-size:15px}
.search-big button:hover{background:var(--gold2)}

/* ladder */
.ladder{border-top:1px solid #26292f;padding:36px 0 40px}
.ladder .lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#77736b;margin-bottom:22px}
.steps{display:grid;grid-template-columns:repeat(6,1fr)}
.step{position:relative;padding-top:22px}
.step::before{content:"";position:absolute;top:5px;left:0;right:0;height:1px;background:#33363d}
.step::after{content:"";position:absolute;top:0;left:0;width:11px;height:11px;border-radius:50%;background:var(--night);border:1px solid var(--gold)}
.step:last-child::after{background:var(--gold)}
.step b{display:block;font-weight:500;font-size:15px;color:#e9e5dc}
.step span{font-size:12px;color:#77736b}

/* ---------- sections on paper ---------- */
main{min-height:60vh}
.sec{padding:96px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:44px}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h2{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.1;margin:0;letter-spacing:-.01em}
h3{font-size:18px;font-weight:500;margin:0}

/* subject cards */
.subj{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-left:1px solid var(--line)}
.sc{position:relative;padding:34px 30px 30px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:250px;display:flex;flex-direction:column;transition:background .25s,color .25s}
.sc .no{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted)}
.sc .nm{font-family:var(--serif);font-size:36px;font-weight:500;margin:auto 0 10px;line-height:1.1}
.sc .ds{font-size:14px;color:var(--muted);line-height:1.5}
.sc .go{position:absolute;top:30px;right:30px;font-size:20px;color:var(--muted);transition:transform .25s,color .25s}
.sc:hover{background:var(--night);color:#f4f1ea}
.sc:hover .go{transform:translate(4px,-4px);color:var(--gold)}
.sc:hover .ds,.sc:hover .no{color:#9f9a90}

/* features */
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}
.ft{padding:28px 26px 0 0}
.ft .n{font-family:var(--serif);font-size:15px;font-style:italic;color:var(--gold);margin-bottom:14px}
.ft p{color:var(--muted);font-size:15px;margin:8px 0 0}

/* ---------- subject page ---------- */
.shead{padding:72px 0 0}
.crumbs{font-size:13px;letter-spacing:.04em;color:#8a857c;margin-bottom:26px}
.crumbs a:hover{color:#fff}
.shead h1{font-family:var(--serif);font-weight:500;font-size:76px;line-height:1;margin:0}
.shead .sub{color:#a9a49a;margin:18px 0 0;max-width:560px;font-weight:300;font-size:17px}
.tabs{display:flex;gap:40px;margin-top:56px;overflow-x:auto}
.tabs a{padding:0 0 18px;font-size:15px;color:#9a958b;border-bottom:2px solid transparent;white-space:nowrap;transition:.2s}
.tabs a:hover{color:#fff}
.tabs a.on{color:#fff;border-bottom-color:var(--gold)}
.body{padding:64px 0 100px}

/* olympiad cards */
.ogroup{margin-bottom:56px}
.ogroup:last-child{margin-bottom:0}
.olist{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.oc{display:flex;align-items:center;gap:22px;background:var(--card);border:1px solid var(--line);padding:24px 26px;transition:.2s}
.oc:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.oc .mono{width:52px;height:52px;flex:none;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:18px;color:var(--ink2)}
.oc:hover .mono{background:var(--night);color:var(--gold2);border-color:var(--night)}
.oc .lv{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.oc .arr{margin-left:auto;color:var(--muted)}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;font-weight:500;border:1px solid var(--ink);cursor:pointer;font-size:15px;background:var(--ink);color:#fff;border-radius:2px;transition:.2s}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn[disabled]{opacity:.35;cursor:default}
input[type=text],select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--card);font:inherit;font-size:15px;color:var(--ink);appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=text]:focus,select:focus{outline:none;border-color:var(--ink)}

/* topics */
.layout{display:grid;grid-template-columns:230px 1fr;gap:56px;align-items:start}
.topics{position:sticky;top:100px}
.topics .tsec{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.topics .tsec:first-child{margin-top:0}
.topics button{display:block;width:100%;text-align:left;background:none;border:none;padding:7px 0 7px 14px;border-left:1px solid var(--line);cursor:pointer;color:var(--ink2);font-size:15px;transition:.15s}
.topics button:hover{color:var(--ink);border-left-color:var(--ink2)}
.topics button.on{color:var(--ink);border-left:2px solid var(--gold);padding-left:13px;font-weight:500}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:26px}
.plist{border-top:1px solid var(--ink)}
.pr{display:grid;grid-template-columns:44px 1fr auto;gap:18px;align-items:center;padding:22px 6px;border-bottom:1px solid var(--line);transition:background .15s}
.pr:hover{background:var(--card)}
.pr .idx{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px}
.pr .idx.done{color:var(--ok)}
.pr h3{font-size:17px}
.pr .meta{font-size:13px;color:var(--muted);margin-top:3px}
.pill{font-size:12px;padding:3px 10px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.lvl{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.lvl i{width:12px;height:2px;background:var(--line)}
.lvl i.f{background:var(--gold)}
.empty{padding:70px 24px;text-align:center;color:var(--muted);border:1px dashed var(--line);font-size:15px}
.empty .serif{display:block;font-size:26px;color:var(--ink);margin-bottom:6px}

/* problem */
.pgrid{display:grid;grid-template-columns:1fr 270px;gap:64px;align-items:start}
.pt{font-family:var(--serif);font-weight:500;font-size:42px;line-height:1.1;margin:0 0 30px}
.statement{font-size:18px;line-height:1.7;border-top:1px solid var(--ink);padding-top:28px}
.statement p{margin:0 0 14px}
.answer{margin-top:32px;padding:24px;background:var(--card);border:1px solid var(--line)}
.answer label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.arow{display:flex;gap:10px;margin-top:12px}
.arow input{flex:1;background:#fff}
.fb{margin-top:12px;padding:12px 14px;font-size:15px;display:none}
.fb.ok{display:block;background:var(--ok-l);color:var(--ok)}
.fb.bad{display:block;background:var(--bad-l);color:var(--bad)}
details.sol{margin-top:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
details.sol summary{padding:20px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-family:var(--serif);font-size:22px}
details.sol summary::after{content:"+";font-family:Onest;font-weight:300;font-size:24px;line-height:1;color:var(--gold)}
details.sol[open] summary::after{content:"−"}
details.sol .in{padding-bottom:22px;font-size:17px}
details.sol .in p{margin:0 0 10px}
.navp{display:flex;justify-content:space-between;margin-top:36px;gap:10px}
.side{border-top:1px solid var(--ink);padding-top:22px}
.side dl{margin:0;font-size:14px}
.side dt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:18px}
.side dt:first-child{margin-top:0}
.side dd{margin:4px 0 0;font-size:15px}
.side .btn{width:100%;justify-content:center;margin-top:28px}
.side .btn.done{background:var(--ok-l);color:var(--ok);border-color:var(--ok-l)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:15px;background:var(--card)}
.tbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding:14px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
.tbl td{padding:16px;border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:#fff}
.tbl .y{font-family:var(--serif);font-size:20px}
.medal{display:inline-flex;align-items:center;gap:8px}
.medal::before{content:"";width:9px;height:9px;border-radius:50%}
.m-g::before{background:#c9a227}.m-s::before{background:#a3a9ad}.m-b::before{background:#b06f43}
.note{font-size:14px;color:var(--muted);margin-top:18px}

/* materials */
.mats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.mt{background:var(--card);border:1px solid var(--line);padding:26px}
.mt p{color:var(--muted);font-size:14px;margin:8px 0 0}
.mt .soon{display:inline-block;margin-top:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}

/* simple pages */
.page{padding:80px 0 110px}
.page h1{font-family:var(--serif);font-weight:500;font-size:56px;margin:0 0 20px}
.prose{max-width:680px;font-size:18px;color:var(--ink2)}

footer{background:var(--night);color:#8a857c;padding:44px 0;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
footer .logo{color:#f4f1ea;font-size:20px}
.demo-note{background:var(--night2);color:#8a857c;font-size:12px;letter-spacing:.06em;text-align:center;padding:9px 16px}
sub,sup{font-size:.72em}

@media (max-width:900px){
  .hero{padding:72px 0 64px}
  .hero h1{font-size:44px}
  .shead h1{font-size:52px}
  h2{font-size:34px}
  .subj{grid-template-columns:1fr 1fr}
  .feats{grid-template-columns:1fr 1fr;gap:10px}
  .steps{grid-template-columns:repeat(3,1fr);row-gap:22px}
  .olist,.mats{grid-template-columns:1fr}
  .layout,.pgrid{grid-template-columns:1fr;gap:32px}
  .topics{position:static}
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar .search{grid-column:1/-1}
  .links{display:none;position:absolute;top:70px;left:0;right:0;background:var(--night);flex-direction:column;gap:16px;padding:20px 28px;border-bottom:1px solid #26292f}
  .links.open{display:flex}
  .burger{display:block}
  .tbl .hide-m{display:none}
  .sec{padding:64px 0}
}
@media (max-width:560px){ .subj{grid-template-columns:1fr} .sc{min-height:190px} .pr{grid-template-columns:34px 1fr} .pr .pill{display:none} }

/* ===== СВЕТЛАЯ ТЕМА (поверх) ===== */
:root{--serif:Onest,system-ui,sans-serif;--blue:#1f4fd1;--blue-l:#f2f5fd;--paper:#fafafa;--card:#ffffff;--line:#e6e6e6;--muted:#7b7b7b}
body{background:#fff}
header{background:rgba(255,255,255,.94);color:var(--ink);border-bottom:1px solid var(--line)}
.logo{font-weight:700;letter-spacing:-.02em;font-size:21px}
.logo i{font-style:normal;color:var(--blue)}
.links a{color:#555}
.links a:hover,.links a.on{color:var(--ink);border-bottom-color:var(--blue)}
.burger{border-color:var(--line);color:var(--ink)}
.dark{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.dark::before{display:none}
.eyebrow{color:var(--blue);letter-spacing:.18em}
.eyebrow::before{background:var(--blue)}
.hero h1{font-weight:700;font-size:60px;letter-spacing:-.035em;line-height:1.05}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero p{color:var(--muted);font-weight:400}
.search-big{border:1px solid #d4d4d4;background:#fff;border-radius:8px;overflow:hidden}
.search-big:focus-within{border-color:var(--ink)}
.search-big input{color:var(--ink)}
.search-big input::placeholder{color:#a0a0a0}
.search-big button{background:var(--ink);color:#fff}
.search-big button:hover{background:var(--blue)}
.ladder{border-top:1px solid var(--line)}
.ladder .lbl{color:var(--muted)}
.step::before{background:var(--line)}
.step::after{background:#fff;border:1.5px solid var(--blue)}
.step:last-child::after{background:var(--blue)}
.step b{color:var(--ink)}
.step span{color:var(--muted)}
.kicker{color:var(--blue)}
h2{font-weight:700;letter-spacing:-.03em;font-size:38px}
.subj{grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sc{min-height:220px}
.sc .no{font-style:normal;font-size:13px;color:var(--muted)}
.sc .nm{font-weight:600;font-size:26px;letter-spacing:-.02em;margin:56px 0 10px}
.sc:hover{background:var(--blue-l);color:var(--ink)}
.sc:hover .go{color:var(--blue)}
.sc:hover .ds,.sc:hover .no{color:var(--muted)}
.sc.more{color:var(--muted);justify-content:center;align-items:center;text-align:center;font-size:14px;background:var(--paper)}
.sc.more:hover{background:var(--paper)}
.ft .n{font-style:normal;color:var(--blue);font-weight:600}
.crumbs{color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.shead h1{font-weight:700;letter-spacing:-.035em;font-size:60px}
.shead .sub{color:var(--muted);font-weight:400}
.tabs a{color:var(--muted)}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--blue)}
.oc{border-radius:8px}
.oc .mono{border-radius:6px;font-weight:600;font-size:15px}
.oc:hover{border-color:var(--blue);box-shadow:none;transform:none}
.oc:hover .mono{background:var(--blue);color:#fff;border-color:var(--blue)}
.oc:hover .arr{color:var(--blue)}
.btn,input[type=text],select{border-radius:8px}
.topics button.on{border-left-color:var(--blue)}
.pr .idx{font-style:normal;font-size:13px}
.lvl i.f{background:var(--blue)}
.pill{border-radius:20px}
.pt{font-weight:700;letter-spacing:-.03em;font-size:36px}
details.sol summary{font-weight:600;font-size:18px}
details.sol summary::after{color:var(--blue)}
.answer{border-radius:8px;background:var(--paper)}
.tbl{background:#fff}
.tbl .y{font-weight:600;font-size:16px}
.mt{border-radius:8px}
.mt .soon{color:var(--blue)}
.empty{border-radius:8px}
.empty .serif{font-weight:600;font-size:20px}
footer{background:#fff;border-top:1px solid var(--line);color:var(--muted)}
footer .logo{color:var(--ink)}
.demo-note{background:var(--paper);border-top:1px solid var(--line);color:var(--muted)}
@media (max-width:900px){
  .hero h1,.shead h1{font-size:40px}
  .subj{grid-template-columns:1fr 1fr}
  .links{background:#fff;border-bottom:1px solid var(--line)}
}

/* ===== крупнее шрифты ===== */
body{font-size:17px}
.hero p{font-size:23px;line-height:1.5;max-width:680px;color:#5f5f5f}
.hero h1{font-size:66px}
.eyebrow{font-size:13px}
.search-big input{font-size:17px;padding:20px 22px}
.search-big button{font-size:16px;padding:0 30px}
.ladder .lbl{font-size:13px}
.step b{font-size:17px}
.step span{font-size:14px}
.links{font-size:16px}
.sc .ds{font-size:15px}
.sc .nm{font-size:28px}
.ft h3{font-size:19px}
.ft p{font-size:16px}
.shead .sub{font-size:19px}
.tabs a{font-size:16px}
.oc h3{font-size:18px}
.pr h3{font-size:18px}
.pr .meta{font-size:14px}
.statement{font-size:19px}
.side dd{font-size:16px}
.tbl{font-size:16px}
.mt p,.note{font-size:15px}
@media (max-width:900px){ .hero h1{font-size:42px} .hero p{font-size:19px} }
.wrap.ladder,.wrap.hero{padding-left:28px;padding-right:28px}

/* ===== задача дня ===== */
.daily{border-top:1px solid var(--line);padding:72px 0 88px;background:var(--paper)}
.dtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}
.dtabs button{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:30px;font-size:15px;cursor:pointer;color:var(--ink2)}
.dtabs button:hover{border-color:var(--ink)}
.dtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.badge{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--blue-l);color:var(--blue);white-space:nowrap}

.article{max-width:720px;font-size:19px;color:var(--ink2)}

.hero-photo svg{width:44px;height:44px;stroke:#9aa3b2;fill:none;stroke-width:1.3;display:block;margin:0 auto 8px}

.mtags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.become{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid var(--line);margin-top:56px;padding-top:36px}
.become h3{font-size:22px;font-weight:700}
.become p{color:var(--muted);margin:4px 0 0}
.safety{margin-top:28px;background:var(--blue-l);border-radius:10px;padding:20px 24px;font-size:15px;color:#1b3a8a}
.safety b{display:block;margin-bottom:6px}

.count{color:var(--muted);font-size:15px;margin-bottom:14px}
.cv{border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px}

}

      <div>
        <h1 class="pt">${esc(p.title)}</h1>
        <div class="statement">${p.text}</div>
        <div class="answer">
          <label>Ваш ответ${p.answer.unit?`, ${p.answer.unit}`:""}</label>
          <form class="arow" id="aform">
            <input type="text" id="ans" placeholder="${p.answer.type==='num'?'Например: 12,5':'Например: C2H4'}" autocomplete="off">
            <button class="btn" type="submit">Проверить</button>
          </form>
          <div class="fb" id="fb"></div>
        </div>
        <details class="sol"><summary>Решение</summary><div class="in">${p.solution}</div></details>
        <div class="navp">
          ${prev?`<a class="btn ghost" href="#${prev.id}">← Предыдущая</a>`:"<span></span>"}
          ${next?`<a class="btn ghost" href="#${next.id}">Следующая →</a>`:"<span></span>"}
        </div>
      </div>
      <aside class="side">
        <dl>
          <dt>Олимпиада</dt><dd>${p.olymp}</dd>
          <dt>Год</dt><dd>${p.year}</dd>
          <dt>Класс</dt><dd>${p.grade}</dd>
          <dt>Тема</dt><dd>${p.topic}</dd>
          <dt>Сложность</dt><dd>${lvl(p.diff)}</dd>
          <dt>Источник</dt><dd>Демо-пример</dd>
        </dl>
        <button class="btn ghost ${solved[p.id]?'done':''}" id="mark">${solved[p.id]?'✓ Решено':'Отметить как решённую'}</button>
      </aside>
    </div>
  </div>`;
}
function setMark(p){ const m=$("#mark"); m.classList.toggle("done",!!solved[p.id]); m.textContent = solved[p.id]?"✓ Решено":"Отметить как решённую"; }
function bindProblem(p){
  $("#aform").addEventListener("submit", e=>{
    e.preventDefault();
    const raw = $("#ans").value.trim(), fb = $("#fb");
    if(!raw) return;
    let ok;
    if(p.answer.type==="num"){
      const v = parseFloat(raw.replace(",",".").replace(/\s/g,""));
      ok = !isNaN(v) && Math.abs(v-p.answer.value) <= Math.abs(p.answer.value)*p.answer.tol + 1e-9;
    } else {
      const n = s => s.replace(/\s/g,"").toUpperCase();
      ok = p.answer.value.some(a=>n(a)===n(raw));
    }
    fb.className = "fb " + (ok?"ok":"bad");
    fb.textContent = ok ? "Верно." : "Неверно. Попробуйте ещё раз или откройте решение.";
    if(ok && !solved[p.id]){ solved[p.id]=1; saveSolved(); setMark(p); }
  });
  $("#mark").addEventListener("click", ()=>{ if(solved[p.id]) delete solved[p.id]; else solved[p.id]=1; saveSolved(); setMark(p); });
}

/* ================= ПРОЧЕЕ ================= */

}
function viewCommunity(){

    <div class="mt"><h3 class="serif" style="font-size:24px">Форум</h3><p>Отдельные темы по олимпиадам и задачам.</p><span class="soon">Скоро</span></div>
  </div></div>`;
}
function viewAbout(){

    <p>KazOlymp собирает задания казахстанских, международных и зарубежных олимпиад в одном месте — по годам и по темам.</p>

/* ================= ЗАДАЧА ДНЯ ================= */
const dayNum = () => Math.floor((Date.now() + 5*3600e3) / 86400e3); // по времени Казахстана
function dailyFor(sid){
  const ps = probsOf(sid); if(!ps.length) return null;
  const k = (dayNum() * 7 + sid.length * 13) % ps.length;
  return ps[k];
}
let dailySubj = "chemistry";
function dailyBlock(){
  return `<section class="daily"><div class="wrap">
    <div class="sec-head"><div><p class="kicker">Каждый день новая</p><h2>Задача дня</h2></div></div>
    <div class="dtabs" id="dtabs">${SUBJECTS.map(s=>`<button data-s="${s.id}" class="${s.id===dailySubj?'on':''}">${s.t}</button>`).join("")}</div>
    <div id="dcard"></div>
  </div></section>`;
}
function renderDaily(){
  const s = subjById(dailySubj), p = dailyFor(dailySubj);
  const today = new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
  $("#dcard").innerHTML = p ? `<div class="dcard">
      <div><div class="dt">${s.t} · ${today}</div><h3>${esc(p.title)}</h3>
      <div class="meta">${p.olymp} · ${p.year} · ${p.grade} класс · ${p.topic}</div>
      <div class="tx">${p.text}</div></div>
      <a class="btn" href="#${p.id}">${solved[p.id]?'✓ Решено · открыть':'Решать →'}</a>
    </div>` : `<div class="empty"><span class="serif">Скоро</span>Задача дня по предмету «${s.t}» появится, когда добавим задачи.</div>`;
}
function bindDaily(){
  $("#dtabs").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    dailySubj=b.dataset.s;
    $("#dtabs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    renderDaily();
  });
  renderDaily();
}

/* ================= КАЛЕНДАРЬ (демо-даты) ================= */
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MSHORT = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function viewCalendar(){
  const now = new Date(); now.setHours(0,0,0,0);
  const byM = {};
  EVENTS.forEach(e=>{ const d=new Date(e.date); const k=d.getFullYear()+"-"+d.getMonth(); (byM[k]=byM[k]||{y:d.getFullYear(),m:d.getMonth(),list:[]}).list.push({...e,d}); });
  return darkTitle("Календарь","Ближайшие этапы олимпиад и даты регистрации.") + `<div class="wrap body">
    ${Object.values(byM).map(g=>`<div class="month"><h3>${MONTHS[g.m][0].toUpperCase()+MONTHS[g.m].slice(1)} ${g.y}</h3>
      ${g.list.map(e=>`<div class="ev ${e.d<now?'past':''}"><div class="d">${e.d.getDate()}<small>${MSHORT[e.d.getMonth()]}</small></div>
        <div><h4>${e.t}</h4><div class="meta">${e.subj}</div></div><span class="badge">${e.stage}</span></div>`).join("")}
    </div>`).join("")}
    <p class="note">Даты в демо-версии примерные. Реальные даты возьмём из официальных приказов и сайтов олимпиад.</p>
  </div>`;
}

/* ================= НОВОСТИ (демо) ================= */
// У новости можно указать img: "images/news/имя-файла.jpg" и caption: "подпись к фото"
const PHOTO_ICON = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/></svg>';
const photo = (n, cls) => n.img ? `<div class="${cls}"><img src="${n.img}" alt="${esc(n.t)}" loading="lazy"></div>` : `<div class="${cls}"><div style="text-align:center">${PHOTO_ICON}Фото победителей</div></div>`;

function viewNews(){
  return darkTitle("Новости","Итоги олимпиад, достижения школьников, анонсы и обновления архива.") + `<div class="wrap body">
    <div class="news">${NEWS.map((n,i)=>`<a class="nc ${i===0?'big':''}" href="#${n.id}">
      ${photo(n,"ph")}
      <div class="body"><div class="nm"><span>${n.date}</span><span class="badge">${n.subj}</span></div>
      <h3>${n.t}</h3><p>${n.ex}</p><span class="more">Читать →</span></div></a>`).join("")}</div>
    <p class="note">Это примеры. Настоящие новости будем публиковать со ссылкой на источник.</p>
  </div>`;
}
function viewNewsItem(n){
  return `<section class="dark"><div class="wrap shead" style="padding-bottom:56px">
    <div class="crumbs"><a href="#home">Главная</a> &nbsp;/&nbsp; <a href="#news">Новости</a></div>
    <div class="nm" style="color:var(--muted);font-size:14px;margin-bottom:14px">${n.date} · ${n.subj}</div>
    <h1 style="font-size:46px;max-width:860px">${n.t}</h1></div></section>
  <div class="wrap body">${photo(n,"hero-photo")}${n.caption?`<p class="caption">${n.caption}</p>`:""}<div class="article">${n.body}</div>
  <div style="margin-top:40px"><a class="btn ghost" href="#news">← Все новости</a></div></div>`;
}


/* ================= ТРЕНЕРЫ ================= */
const MF = {subj:"", who:"", format:"", city:""};
let MORDER = null;
function viewMentors(){
  const cities=[...new Set(MENTORS.map(m=>m.city))].sort();
  return darkTitle("Тренеры","Найдите тренера для подготовки к олимпиаде и напишите ему напрямую.") + `<div class="wrap body">
    <div class="mfind">
      <h3>Мне нужен тренер</h3>
      <p class="hint">Выберите предмет и уровень, на котором вы сейчас.</p>
      <div class="mgrid" style="grid-template-columns:repeat(4,1fr)">
        <div><label>Предмет</label><select id="mf-subj">${opts(SUBJECTS.map(s=>s.t),MF.subj,"Любой")}</select></div>
        <div><label>Для кого</label><select id="mf-who"><option value="">Любой уровень</option>${FOR_WHOM.map(w=>`<option value="${w}" ${MF.who===w?"selected":""}>${w} — ${FOR_HINT[w]}</option>`).join("")}</select></div>
        <div><label>Формат</label><select id="mf-format">${opts(["Онлайн","Офлайн"],MF.format,"Любой")}</select></div>
        <div><label>Город</label><select id="mf-city">${opts(cities,MF.city,"Любой")}</select></div>
      </div>
    </div>
    <div class="count" id="mcount"></div>
    <div id="mlist"></div>
    <div class="become">
      <div><h3>Вы тренер?</h3><p>Заполните анкету: образование, опыт, о себе и контакт. После проверки мы добавим вас в список.</p></div>
      ${MENTOR_FORM?`<a class="btn" href="${MENTOR_FORM}">Стать тренером →</a>`:`<span class="btn" style="opacity:.5;cursor:default">Анкета скоро</span>`}
    </div>
    <div class="safety"><b>Безопасность</b><ul>
      <li>Вы пишете тренеру напрямую, сайт не хранит переписку.</li>
      <li>Если вам меньше 18, договаривайтесь о занятиях вместе с родителями.</li>
      <li>Значок «Проверен» означает, что мы проверили образование и достижения тренера.</li>
      <li>Пожаловаться на тренера можно через раздел «О проекте».</li>
    </ul></div>
    <p class="note">Тренеры в демо-версии выдуманные.</p>
  </div>`;
}
function renderMentors(){
  if(!MORDER){ MORDER = MENTORS.map(m=>[Math.random(),m.id]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); }
  const sid = MF.subj ? SUBJECTS.find(s=>s.t===MF.subj).id : "";
  const list = MENTORS.filter(m =>
    (!sid || m.subj===sid) && (!MF.who || m.for.includes(MF.who)) &&
    (!MF.format || m.format.includes(MF.format)) &&
    (!MF.city || m.city===MF.city || m.format.includes("Онлайн"))
  ).sort((a,b)=> MORDER.indexOf(a.id)-MORDER.indexOf(b.id));
  $("#mcount").textContent = list.length ? `Подходят: ${list.length} · порядок случайный, чтобы у всех тренеров были равные шансы` : "";
  $("#mlist").innerHTML = list.length ? `<div class="mlist">${list.map(m=>`
    <div class="mc">
      <div class="top"><div class="av">${m.name[0]}</div>
        <div><h3>${esc(m.name)}${m.verified?'<span class="vf">✓ Проверен</span>':''}</h3>
        <div class="loc">${subjById(m.subj).t} · ${m.city} · опыт ${m.exp} ${m.exp<5?'года':'лет'}</div></div></div>
      <div class="mtags">${m.format.map(f=>`<span class="pill">${f}</span>`).join("")}${m.for.map(f=>`<span class="pill">${f}</span>`).join("")}${m.trial?'<span class="pill" style="color:var(--ok);border-color:#bfe0cb">Пробное бесплатно</span>':''}</div>
      <ul>
        <li><span>Образование:</span> ${esc(m.edu)}</li>
        <li><span>Специализация:</span> ${esc(m.spec)}</li>
      </ul>
      <details class="cv"><summary>О тренере</summary>
        <p>${esc(m.cv)}</p>
      </details>
      <div class="foot" style="margin-top:18px">
        ${m.contact?`<a class="btn" href="${m.contact}" style="width:100%;justify-content:center">Написать тренеру</a>`:`<span class="btn" style="opacity:.5;cursor:default;width:100%;justify-content:center">Написать тренеру</span>`}
      </div>
    </div>`).join("")}</div>` : soon("Пока никого", "Попробуйте другой уровень или формат «Онлайн».");
}
function bindMentors(){
  [["#mf-subj","subj"],["#mf-who","who"],["#mf-format","format"],["#mf-city","city"]].forEach(([s,k])=>
    $(s).addEventListener("change", e=>{MF[k]=e.target.value; renderMentors();}));
  renderMentors();
}

/* ================= РОУТЕР ================= */
function route(){
  const h = (location.hash || "#home").slice(1);
  const app = $("#app");
  let nav = "";
  const p = PROBLEMS.find(x=>x.id===h);
  const o = ALL_OLYMP.find(x=>x.id===h);
  const m = h.match(/^([a-z]+?)(?:-(topics|results|materials))?$/);
  const s = m && subjById(m[1]);
  const ro = h.startsWith("res-") && ALL_OLYMP.find(x=>"res-"+x.id===h);
  const rs = h.startsWith("results-") && subjById(h.slice(8));
  if(h==="results"){ app.innerHTML = viewResultsHome(); nav="results"; }
  else if(rs){ app.innerHTML = viewResultsSubj(rs); nav="results"; }
  else if(ro){ app.innerHTML = viewResultsOlymp(ro); bindResultsOlymp(ro); nav="results"; }
  else if(p){ app.innerHTML = viewProblem(p); bindProblem(p); nav="subjects"; }
  else if(o){ app.innerHTML = viewOlympiad(o); nav="subjects"; }
  else if(s){
    const tab = m[2] || "";
    const body = tab==="topics"?tabTopics(s):tab==="results"?tabResults(s):tab==="materials"?tabMaterials(s):tabOlympiads(s);
    app.innerHTML = subjHeader(s, tab) + `<div class="wrap body">${body}</div>`;
    if(tab==="topics") bindTopics(s);
    nav="subjects";
  }
  else if(h==="subjects"){ app.innerHTML = viewSubjects(); nav="subjects"; }
  else if(h==="calendar"){ app.innerHTML = viewCalendar(); nav="calendar"; }
  else if(h==="news"){ app.innerHTML = viewNews(); nav="news"; }
  else if(NEWS.some(n=>n.id===h)){ app.innerHTML = viewNewsItem(NEWS.find(n=>n.id===h)); nav="news"; }
  else if(h==="mentors"){ app.innerHTML = viewMentors(); bindMentors(); nav="mentors"; }
  else if(h==="community"){ app.innerHTML = viewCommunity(); nav="community"; }
  else if(h==="about"){ app.innerHTML = viewAbout(); nav="about"; }
  else { app.innerHTML = viewHome(); bindHome(); bindDaily(); }
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("on", a.dataset.nav===nav));
  $("#links").classList.remove("open");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
$("#burger").addEventListener("click", ()=>$("#links").classList.toggle("open"));
route();
</script>
